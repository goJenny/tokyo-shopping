function navigate(dest){screen=dest;page=0;query='';render();window.scrollTo(0,0)}
function toggle(id,isOn){if(isOn)purchased.add(id);else purchased.delete(id);save();const el=document.querySelector('[data-id="'+id+'"]');if(el){el.classList.toggle('sold',isOn);el.querySelector('.check span').textContent=isOn?'샀어!':'구매 완료 체크';}}
function home(){const count=purchased.size;const total=ITEMS.reduce((a,b)=>a+(b.price||0),0);return `<p class="lead">도쿄 여행 중 필요한 제품을 사진과 가격으로 바로 확인해! 원하는 카테고리를 눌러봐. 한 페이지에 3개씩 보여줄게. ✨</p><div class="summary"><div><small>내 쇼핑 진행률</small><strong>${count} / ${ITEMS.length}</strong></div><div style="text-align:right"><small>전체 예상가 · 가격 확인 22종</small><strong style="font-size:19px">${yen(total)}</strong></div></div><div class="progress" role="progressbar" aria-valuenow="${count}" aria-valuemin="0" aria-valuemax="${ITEMS.length}"><b style="width:${count/ITEMS.length*100}%"></b></div><div class="photo-storage"><strong>📸 오프라인 사진 준비</strong><p>내장 상품 그림 23개는 인터넷 없이 볼 수 있어. 실제 사진은 설치형 앱(HTTPS)에서 먼저 온라인으로 불러오면 저장을 시도해. 판매처가 차단하면 그림으로 표시돼.</p><button type="button" id="savephotos" data-savephotos>실물 사진 미리 불러오기</button><div id="photostatus" role="status" class="mini">기본 그림 23개 내장 완료</div></div><h2 class="sectiontitle">얼굴에 쓰는 제품</h2>${['recommend','caution','avoid'].map(c=>{let n=catIds(c).length;let x=LABELS[c];return `<button type="button" class="category ${c}" data-navigate="${c}"><span class="emoji">${x.emoji}</span><span class="ctxt"><b>${x.label}</b><small>${n}개 제품 · ${x.detail}</small></span><span class="arrow">›</span></button>`}).join('')}<h2 class="sectiontitle">그 밖의 쇼핑</h2>${(()=>{let c='other',x=LABELS[c];return `<button type="button" class="category other" data-navigate="other"><span class="emoji">${x.emoji}</span><span class="ctxt"><b>기타 쇼핑</b><small>${catIds(c).length}개 · 헤어·바디·간식·잡화·치약</small></span><span class="arrow">›</span></button>`})()}<div class="note">🌼 ‘추천’도 모든 어린이에게 자극이 없다는 뜻은 아니야. 가격은 일본 온라인 판매가 또는 대략적인 참고 가격이며 현지 점포·행사에 따라 달라질 수 있어. 그림은 오프라인에 내장된 제품 식별용 일러스트로, 실제 패키지 사진은 아니야. 온라인에서 실물 사진을 불러올 수 있으면 그 사진이 대신 표시돼. 설치형 앱(HTTPS)에서는 온라인으로 한 번 불러온 사진을 오프라인에서도 볼 수 있게 캐시를 시도해. HTML 파일만 열었을 때는 내장된 식별 그림만 오프라인에서 보장돼.<br><br>⚠️ CHAMINI·쉬글램·슷핀·우루리스 등은 버전/색상이 확인되지 않아 사진이 없거나 대표 이미지야.</div>`}
function filtered(){const arr=screen==='search'?ITEMS:catIds(screen);return arr.filter(x=>!query||[x.name,x.variant,x.note].some(v=>v.toLowerCase().includes(query.toLowerCase())))}
function card(x){const label=LABELS[x.kind].label;const neutral=x.kind==='other';return `<article class="card ${purchased.has(x.id)?'sold':''}" data-id="${x.id}"><div class="visual"><img class="offline-art" src="${x.art}" alt="${esc(x.name)} 오프라인용 제품 식별 그림">${x.img?`<img class="real-photo" loading="lazy" src="${esc(x.img)}" alt="${esc(x.name)} 온라인 참고 사진" referrerpolicy="no-referrer" onload="this.nextElementSibling.textContent='실물 참고 사진 · 캐시 가능';this.nextElementSibling.classList.add('real')" onerror="this.hidden=true"><span class="photo-legend">오프라인 식별 이미지</span>`:`<span class="photo-legend">오프라인 식별 이미지</span>`}${!neutral?`<span class="overlay"><span class="chip ${x.kind}">${label}</span></span>`:''}</div><div class="cardbody"><div class="cardtop"><h3>${esc(x.name)}</h3><div class="price">${yen(x.price)}<small>${x.price==null?'': '일본 예상가'}</small></div></div><div class="variant">${esc(x.variant)}</div><p class="desc">${esc(x.note)}</p><div class="actions"><label class="check"><input type="checkbox" data-check="${x.id}" ${purchased.has(x.id)?'checked':''} aria-label="${esc(x.name)} 구매 완료"><span>${purchased.has(x.id)?'샀어!':'구매 완료 체크'}</span></label>${x.url?`<a class="sourcelink" target="_blank" rel="noopener noreferrer" href="${esc(x.url)}">상품 정보 ↗</a>`:`<span class="warning">실물 확인 필요</span>`}</div></div></article>`}
function listing(){const x=LABELS[screen]||{label:'전체 상품',emoji:'🛍️',detail:'모든 쇼핑 목록'};const all=filtered(),pages=Math.max(1,Math.ceil(all.length/PAGE_SIZE));page=Math.max(0,Math.min(page,pages-1));const start=page*PAGE_SIZE;let info=(screen==='search')?'카테고리에 관계없이 모든 제품 검색':x.detail;return `<div class="viewheader"><button class="back" data-navigate="home" aria-label="홈으로">‹</button><h2>${x.emoji} ${x.label}</h2></div><p class="sub">${esc(info)}</p><input class="search" id="search" placeholder="제품명이나 색상 검색 🔎" autocomplete="off" value="${esc(query)}"><div class="viewbar"><span class="tiny">전체 ${all.length}개 · 페이지당 3개</span>${screen!=='other'&&screen!=='search'?`<span class="chip ${screen}">${x.label}</span>`:''}</div>${all.length?all.slice(start,start+PAGE_SIZE).map(card).join(''):`<div class="empty">검색 결과가 없어 🥺</div>`}<div class="pager"><button data-pg="-1" ${page===0?'disabled':''}>← 이전</button><span>${page+1} / ${pages} 페이지</span><button data-pg="1" ${page===pages-1?'disabled':''}>다음 →</button></div><div class="note">구매 체크는 이 기기에 저장돼. 다른 기기에서 자동으로 동기화되지는 않아. 💾</div>`}
function render(){const focus=document.activeElement?.id==='search';let pos=focus?document.activeElement.selectionStart:null;$('app').innerHTML=screen==='home'?home():listing();updateTotals();if(focus&&$('search')){$('search').focus();$('search').setSelectionRange(pos,pos)}}
async function preparePhotos(btn){if(!navigator.onLine){$('photostatus').textContent='오프라인 상태 · 기본 그림은 모두 볼 수 있어';return;}if(!navigator.serviceWorker||!/^https?:$/.test(location.protocol)){$('photostatus').textContent='HTML 직접 실행: 실물 사진 영구 저장은 불가해. 내장 상품 그림 23개는 오프라인에서 보여.';return;}try{await navigator.serviceWorker.ready;}catch(e){}if(!navigator.serviceWorker.controller){$('photostatus').textContent='사진 저장 준비 중이야. 잠시 후 다시 눌러줘.';return;}btn.disabled=true;btn.textContent='사진 불러오는 중…';const images=ITEMS.filter(x=>x.img);let ok=0,fail=0;for(const x of images){const result=await new Promise(resolve=>{const img=new Image();img.referrerPolicy='no-referrer';const timer=setTimeout(()=>{img.src='';resolve(false)},7500);img.onload=()=>{clearTimeout(timer);resolve(true)};img.onerror=()=>{clearTimeout(timer);resolve(false)};img.src=x.img});if(result)ok++;else fail++;if($('photostatus'))$('photostatus').textContent=`사진 불러오기 ${ok+fail}/${images.length} · 성공 ${ok} · 실패 ${fail}`;}if($('photostatus'))$('photostatus').textContent=`${ok}개 실물 사진 로드 성공 · ${fail}개 실패. 설치형 앱에서 열린 사진은 캐시될 수 있어.`;btn.textContent='실물 사진 다시 확인';btn.disabled=false;}
document.addEventListener('click',e=>{const pic=e.target.closest('[data-savephotos]');if(pic){preparePhotos(pic);return;}const nav=e.target.closest('[data-navigate]');if(nav){navigate(nav.dataset.navigate);return;}const pg=e.target.closest('[data-pg]');if(pg){const step=Number(pg.dataset.pg);page+=step;render();window.scrollTo({top:130,behavior:'smooth'})}});
document.addEventListener('change',e=>{if(e.target.matches('[data-check]'))toggle(e.target.dataset.check,e.target.checked)});
document.addEventListener('input',e=>{if(e.target.id==='search'){query=e.target.value;page=0;render()}});
$('homebtn').addEventListener('click',()=>navigate('home'));
if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol)){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}))}
render();
</script></body></html>
